name: KodamaHarness
version: '1.0'
main: dev.kodama.harness.HarnessPlugin
api-version: '1.20'
description: Benchmark and vanilla-parity test harness for Kodama
commands:
  harness:
    description: Control the Kodama test harness
    usage: /harness <metrics start|metrics stop|pregen <radius>|stop>
    permission: kodama.harness
permissions:
  kodama.harness:
    description: Use /harness
    default: op
